<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FaceChart">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>FaceChart – Mapa de pontos</title>
<style>
:root{--bg:#0a1020;--bg2:#16233f;--panel:#101a2e;--line:#1f2f4d;--cy:#5fd4f0;--gold:#f0b84a;--tx:#e6eefc;--mut:#8ea3c4;--red:#ee5a5a;--onacc:var(--onacc);--face:#0b1326;--grid:#2c4465;--wh:#e6eefc}
*{box-sizing:border-box}
body{margin:0;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left);background:radial-gradient(120% 80% at 20% 0%,var(--bg2),var(--bg));color:var(--tx);font:15px/1.4 "Trebuchet MS","Segoe UI",sans-serif;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 70%,transparent)}
h1{font-size:17px;margin:0;color:var(--cy);font-weight:600}
button{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--cy)}
.ico{display:flex;align-items:center;padding:8px 10px}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible,.pin:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.pri{background:var(--cy);color:var(--onacc);border-color:var(--cy);font-weight:600}
.danger{color:var(--red)}
main{max-width:640px;margin:0 auto;padding:14px 14px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px}
.seg{display:flex;gap:2px;background:var(--panel);padding:3px;border-radius:12px;border:1px solid var(--line)}
.seg button{flex:none;border:0;background:transparent;color:var(--mut);padding:6px 11px;font-size:13px;border-radius:9px}
.tools{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;width:min(100%,520px)}
.tg{display:flex;gap:5px}
.tools .ico{padding:8px 9px}
.seg button[aria-pressed=true]{background:var(--cy);color:var(--onacc);font-weight:600}
.hint{margin:0;color:var(--mut);font-size:13px;text-align:center}
#wrap{position:relative;width:min(100%,520px);aspect-ratio:3/4;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--face);cursor:crosshair;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#wrap svg.face{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#layer{position:absolute;inset:0}
.pin{position:absolute;transform:translate(-50%,-50%);background:var(--cy);color:var(--onacc);font-weight:700;font-size:12px;padding:3px 8px;border-radius:99px;border:2px solid var(--wh);box-shadow:0 2px 8px #0008;cursor:grab;touch-action:none;user-select:none}
.pin:active{cursor:grabbing}
.pin{-webkit-touch-callout:none}
.sum{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.total{font-size:38px;font-weight:700;color:var(--cy);line-height:1}
.sub{color:var(--mut);font-size:13px;min-height:18px}
.info{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;color:var(--mut);font-size:13px}
.info b{color:var(--tx);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
/* SVG */
.c{stroke:var(--cy);fill:none;stroke-width:3}.w{stroke:var(--wh);fill:none;stroke-width:2}
.t{stroke:var(--cy);fill:none;stroke-width:1;opacity:.28}.d{stroke:var(--wh);fill:none;stroke-width:1.2;stroke-dasharray:2 6;opacity:.7}.gr{stroke:var(--grid)}
.gd{stroke:var(--gold);fill:none;stroke-width:1.4}.lb{fill:var(--gold);font-size:12px;font-family:inherit}
/* lixeira */
#lixeira{position:absolute;right:10px;bottom:10px;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--panel) 80%,transparent);border:1.5px dashed var(--mut);color:var(--mut);opacity:.55;pointer-events:none;z-index:2;transition:transform .18s,opacity .18s,background .18s,color .18s,border-color .18s}
#lixeira svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
#lixeira .lid{transform-box:fill-box;transform-origin:left bottom;transition:transform .18s}
#lixeira.on{opacity:1;transform:scale(1.08)}
#lixeira.hot{opacity:1;transform:scale(1.3);color:#fff;background:var(--red);border-color:var(--red);border-style:solid}
#lixeira.hot .lid{transform:rotate(-28deg)}
#lixeira.bump{animation:lixo .4s ease}
@keyframes lixo{0%{transform:scale(1.3)}35%{transform:scale(1.15) rotate(-9deg)}70%{transform:scale(1.28) rotate(6deg)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#lixeira,#lixeira .lid{transition:none}#lixeira.bump{animation:none}}
/* estilos de desenho */
.l-zn{display:none}.zn{fill:var(--gold);fill-opacity:.2;stroke:var(--gold);stroke-width:1.2;stroke-dasharray:4 3}
#wrap:not([data-d=blueprint]) :is(.l-grid,.l-t,.l-ar){display:none}
#wrap[data-d=zonas] .l-zn{display:inline}
#wrap[data-d=minimal] .c{stroke-width:2}
#wrap[data-d=solido] .head{fill:color-mix(in srgb,var(--cy) 14%,var(--face))}
#wrap[data-d=neon] .c{stroke-width:3.5;filter:drop-shadow(0 0 5px var(--cy))}
#wrap[data-d=neon] .w{filter:drop-shadow(0 0 4px var(--wh))}
/* configurações */
.box h3{margin:14px 0 8px;font-size:13px;color:var(--mut);font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:10px;text-align:left;font-size:13px}
.opt[aria-pressed=true]{border-color:var(--cy);box-shadow:0 0 0 1px var(--cy)}
.opt small{color:var(--mut);font-size:11px}
.sw{display:flex;gap:3px}.sw i{width:14px;height:14px;border-radius:50%;border:1px solid #8888}
/* modais */
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 82%,transparent);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.open{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:380px;max-height:90vh;overflow:auto}
.box h2{margin:0 0 4px;font-size:17px}.box p{margin:0 0 14px;color:var(--mut);font-size:13px}
.doses{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.doses button{padding:12px 0;font-weight:700}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
input:focus,textarea:focus{outline:2px solid var(--cy);border-color:transparent}
.acts{display:flex;gap:8px;margin-top:14px}.acts button{flex:1}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.item small{color:var(--mut);display:block}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--cy);color:var(--onacc);padding:10px 16px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
</style>
</head>
<body>
<!-- definições compartilhadas -->

    <g id="mk"><circle r="9" class="gd"/><circle r="4" class="gd"/><path d="M-6 0H6M0-6V6" class="gd"/></g>

<header>

  </div>
</header>

<main>
  <div class="tools" role="toolbar" aria-label="Ferramentas">
    <div class="seg" role="group" aria-label="Visão">
      <button id="v-frontal" aria-pressed="true">Frontal</button>
      <button id="v-perfil" aria-pressed="false">Perfil</button>

    <div class="tg">
      <button id="b-undo" class="ico" aria-label="Desfazer" title="Desfazer" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
      <button id="b-mirror" class="ico" aria-label="Espelhar pontos" title="Espelhar pontos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18" stroke-dasharray="2 3"/><path d="M8 7l-5 5 5 5V7z"/><path d="M16 7l5 5-5 5V7z"/></svg></button>
      <button id="b-clear" class="ico danger" aria-label="Limpar pontos" title="Limpar pontos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
      <button id="b-pdf" class="ico" aria-label="Exportar PDF" title="Exportar PDF"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/></svg></button>
      <button id="b-save" class="ico pri" aria-label="Salvar mapeamento" title="Salvar mapeamento"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg></button>
    </div>
  </div>

  <div id="wrap">
    <!-- FRONTAL -->

      <rect class="l-grid gr" x="60" y="30" width="480" height="740" fill="url(#grid)"/>
      <g class="t l-t"><circle cx="300" cy="240" r="25"/><circle cx="300" cy="240" r="50"/><circle cx="300" cy="240" r="75"/><circle cx="300" cy="240" r="100"/><circle cx="300" cy="240" r="125"/>
        <circle cx="300" cy="330" r="14"/><circle cx="300" cy="330" r="30"/><circle cx="300" cy="330" r="48"/>
        <ellipse cx="300" cy="520" rx="210" ry="230"/><circle cx="300" cy="690" r="95"/></g>
      <path class="c head" d="M300 40C130 40 95 260 100 420C105 600 190 750 300 770C410 750 495 600 500 420C505 260 470 40 300 40Z"/>
      <path class="w l-ar" d="M118 350C135 170 230 130 300 130C370 130 465 170 482 350"/>
      <path class="w l-ar" d="M104 400C100 500 170 535 245 515"/><path class="w l-ar" d="M496 400C500 500 430 535 355 515"/>
      <circle cx="190" cy="425" r="88" class="d l-ar"/><circle cx="410" cy="425" r="88" class="d l-ar"/>
      <line x1="300" y1="10" x2="300" y2="790" class="d"/>
      <path class="w" d="M118 378Q190 335 265 372Q272 388 255 388Q190 366 125 392Z"/><path class="w" d="M482 378Q410 335 335 372Q328 388 345 388Q410 366 475 392Z"/>

      <path class="c" d="M240 668Q270 646 300 656Q330 646 360 668Q330 692 300 690Q270 692 240 668Z"/>

      <g class="l-zn"><ellipse class="zn" cx="300" cy="190" rx="150" ry="48"/><ellipse class="zn" cx="300" cy="338" rx="46" ry="30"/><ellipse class="zn" cx="128" cy="430" rx="30" ry="42"/><ellipse class="zn" cx="472" cy="430" rx="30" ry="42"/><ellipse class="zn" cx="170" cy="610" rx="28" ry="46"/><ellipse class="zn" cx="430" cy="610" rx="28" ry="46"/><ellipse class="zn" cx="300" cy="738" rx="40" ry="30"/></g>
      <use href="#mk" x="300" y="170"/><use href="#mk" x="300" y="340"/><use href="#mk" x="150" y="428"/><use href="#mk" x="450" y="428"/>
      <use href="#mk" x="240" y="668"/><use href="#mk" x="360" y="668"/><use href="#mk" x="300" y="770"/>
      <text class="lb" x="312" y="165">Frontal</text><text class="lb" x="312" y="344">Glabela</text>
      <text class="lb" x="6" y="400">Pés de galinha</text><text class="lb" x="594" y="400" text-anchor="end">Pés de galinha</text>
      <text class="lb" x="312" y="792">Mento</text><text class="lb" x="594" y="24" text-anchor="end">Mapa facial · frontal</text>
    </svg>
    <!-- PERFIL -->
    <svg id="svg-perfil" class="face" viewBox="0 0 600 800" aria-label="Rosto de perfil" style="display:none">
      <rect class="l-grid gr" x="60" y="30" width="480" height="740" fill="url(#grid)"/>
      <g class="t l-t"><circle cx="330" cy="220" r="30"/><circle cx="330" cy="220" r="60"/><circle cx="330" cy="220" r="90"/><circle cx="330" cy="220" r="120"/>
        <circle cx="440" cy="345" r="45"/><circle cx="440" cy="345" r="85"/><circle cx="330" cy="560" r="140"/></g>

      <text class="lb" x="452" y="166">Frontal</text><text class="lb" x="482" y="296">Glabela</text>

    <div id="layer"></div>

  </div>

  <section class="sum">
    <div><div class="sub">Total de unidades</div><div class="total" id="total">0 U</div></div>
    <div class="sub" id="sub"></div>
    <div class="info">
      <span>Paciente: <b id="r-nome"></b></span><span>Data: <b id="r-data"></b></span>
      <span>Lote: <b id="r-lote"></b></span><span>Fornecedor: <b id="r-forn"></b></span>
    </div>
    <div class="sub" id="count">0 pontos</div>
  </section>
</main>

<!-- Modal dose -->
<div class="modal" id="m-dose" role="dialog" aria-modal="true" aria-labelledby="md-t"><div class="box">
  <h2 id="md-t">Novo ponto</h2><p>Escolha as unidades (U).</p>
  <div class="doses" id="doses"></div>
  <div class="acts"><button id="md-del" class="danger" style="display:none">Apagar ponto</button><button data-close>Cancelar</button></div>
</div></div>

<!-- Modal dados -->
<div class="modal" id="m-dados" role="dialog" aria-modal="true" aria-labelledby="mdd-t"><div class="box">
  <h2 id="mdd-t">Dados do atendimento</h2>
  <label for="f-nome">Paciente</label><input id="f-nome" maxlength="80">
  <label for="f-data">Data</label><input id="f-data" type="date">
  <label for="f-lote">Lote</label><input id="f-lote" maxlength="40">
  <label for="f-forn">Fornecedor</label><input id="f-forn" maxlength="60">
  <label for="f-obs">Observações</label><textarea id="f-obs" rows="3" maxlength="500"></textarea>
  <div class="acts"><button data-close>Cancelar</button><button id="md-ok" class="pri">Salvar dados</button></div>
</div></div>

<!-- Modal histórico -->
<div class="modal" id="m-hist" role="dialog" aria-modal="true" aria-labelledby="mh-t"><div class="box">
  <h2 id="mh-t">Histórico</h2><p>Salvos neste aparelho. Exporte para guardar um backup em arquivo.</p>
  <div id="hist-list"></div>
  <div class="acts"><button id="h-exp">Exportar</button><button id="h-imp">Importar</button></div>
  <input type="file" id="h-file" accept=".json,application/json" hidden>
  <div class="acts"><button data-close>Fechar</button></div>
</div></div>

<!-- Modal configurações -->
<div class="modal" id="m-conf" role="dialog" aria-modal="true" aria-labelledby="mc-t"><div class="box">
  <h2 id="mc-t">Configurações</h2>
  <h3>Esquema de cores</h3><div class="opts" id="c-temas"></div>
  <h3>Desenho do rosto</h3><div class="opts" id="c-desenhos"></div>
  <h3>Marcação de pontos</h3><div class="opts" id="c-marcacao"></div>
  <h3>Como usar</h3>
  <p id="c-ajuda"></p>
  <div class="acts"><button data-close>Fechar</button></div>
</div></div>

<div id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const KEY = 'facechart_v2';
const DOSES = [0.5, 1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10, 12];
const hoje = () => new Date().toISOString().slice(0, 10);

let dados = { nome: 'Paciente', data: hoje(), lote: '', fornecedor: '', obs: '' };
let pontos = [];              // {id, x, y, u, v}  x,y em fração (0 a 1) da imagem
let sessoes = [];
let visao = 'frontal';
let undoStack = [];
let alvo = null;
let conf = { tema: 'blueprint', desenho: 'blueprint', marcacao: 'padrao' };

/* ---------- temas e desenhos ---------- */
const CHAVES = ['bg','bg2','panel','line','cy','gold','tx','mut','onacc','face','grid','wh'];
const TEMAS = [

/* ---------- armazenamento ---------- */
function carregar() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (s.dados) dados = { ...dados, ...s.dados };
    if (Array.isArray(s.pontos)) pontos = s.pontos;
    if (Array.isArray(s.sessoes)) sessoes = s.sessoes;
    if (s.conf) conf = { ...conf, ...s.conf };
    if (conf.marcacao === 'profissional') conf.marcacao = 'rapido';   // nome antigo
  } catch (e) { /* storage indisponível ou corrompido: segue com valores padrão */ }
}
function persistir() {
  try { localStorage.setItem(KEY, JSON.stringify({ dados, pontos, sessoes, conf })); }
  catch (e) { toast('Não foi possível gravar neste navegador.'); }
}

/* ---------- utilitários ---------- */
const fmt = n => n.toLocaleString('pt-BR', { maximumFractionDigits: 1 });
const dataBR = iso => iso && /^\d{4}-\d{2}-\d{2}$/.test(iso) ? iso.split('-').reverse().join('/') : (iso || '—');
let tt;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); }
function snapshot() { undoStack.push(JSON.stringify(pontos)); if (undoStack.length > 50) undoStack.shift(); }
function abrir(id) { $(id).classList.add('open'); }
function fechar() { document.querySelectorAll('.modal.open').forEach(m => m.classList.remove('open')); alvo = null; }

/* ---------- render ---------- */
function render(manter) {
  const layer = $('layer');
  if (!manter) layer.replaceChildren();
  pontos.filter(p => !manter && p.v === visao).forEach(p => {
    const pin = document.createElement('div');
    pin.className = 'pin';
    pin.tabIndex = 0;
    pin.setAttribute('role', 'button');
    pin.setAttribute('aria-label', `Ponto de ${fmt(p.u)} unidades. Toque para editar.`);
    pin.style.left = p.x * 100 + '%';
    pin.style.top = p.y * 100 + '%';
    pin.textContent = fmt(p.u) + 'U';
    ligarPin(pin, p);
    layer.appendChild(pin);
  });

  const total = pontos.reduce((s, p) => s + p.u, 0);
  $('total').textContent = fmt(total) + ' U';
  $('count').textContent = `${pontos.length} ponto${pontos.length === 1 ? '' : 's'}`;
  // subtotais por lado (frontal): esquerda da tela = lado direito do paciente
  const fr = pontos.filter(p => p.v === 'frontal');
  const soma = f => fmt(fr.filter(f).reduce((s, p) => s + p.u, 0));
  $('sub').textContent = fr.length ? `Dir. ${soma(p => p.x < 0.48)} U · Centro ${soma(p => p.x >= 0.48 && p.x <= 0.52)} U · Esq. ${soma(p => p.x > 0.52)} U` : '';
  $('b-undo').disabled = undoStack.length === 0;

  $('r-nome').textContent = dados.nome || '—';
  $('r-data').textContent = dataBR(dados.data);
  $('r-lote').textContent = dados.lote || '—';
  $('r-forn').textContent = dados.fornecedor || '—';
  persistir();
}

function mudarVisao(v) {
  visao = v;
  $('svg-frontal').style.display = v === 'frontal' ? '' : 'none';
  $('svg-perfil').style.display = v === 'perfil' ? '' : 'none';
  $('v-frontal').setAttribute('aria-pressed', v === 'frontal');
  $('v-perfil').setAttribute('aria-pressed', v === 'perfil');
  $('b-mirror').disabled = v !== 'frontal';
  render();
}

/* ---------- interação com os pontos ---------- */
const wrap = $('wrap');
const clamp = v => Math.max(0.02, Math.min(0.98, v));

let ultimoToque = {}, editTimer = null, bloqueio = 0, bloqueioModal = 0;

function apagarPonto(p) {
  snapshot();
  pontos = pontos.filter(q => q.id !== p.id);
  bloqueio = Date.now() + 500;   // evita que o clique residual crie um ponto novo
  render(); toast('Ponto apagado. Use Desfazer para voltar.');
}

function somarUnidade(p) {
  if (p.u >= 100) { toast('Limite de 100 U por ponto.'); return; }
  snapshot(); p.u += 1;
  bloqueio = Date.now() + 350;   // evita clique residual criar ponto novo
  render();
}

function sobreLixeira(e) {
  const r = $('lixeira').getBoundingClientRect(), m = 14;
  return e.clientX >= r.left - m && e.clientX <= r.right + m && e.clientY >= r.top - m && e.clientY <= r.bottom + m;
}

// Ponto solto na lixeira: apaga os dados já e anima o pino sendo "jogado" lá dentro
function descartar(pin, p, antes) {
  const lix = $('lixeira');
  undoStack.push(antes);                       // desfazer devolve o ponto à posição original
  pontos = pontos.filter(q => q.id !== p.id);
  bloqueio = Date.now() + 700;
  render(true);                                // atualiza totais sem refazer os pontos
  const w = wrap.getBoundingClientRect(), l = lix.getBoundingClientRect();
  pin.style.pointerEvents = 'none';
  pin.style.transition = 'left .42s cubic-bezier(.15,.7,.35,1), top .42s cubic-bezier(.55,0,.9,.55), transform .42s ease-in, opacity .42s ease-in';
  pin.style.left = ((l.left + l.width / 2 - w.left) / w.width * 100) + '%';
  pin.style.top = ((l.top + l.height / 2 - w.top) / w.height * 100) + '%';
  pin.style.transform = 'translate(-50%,-50%) scale(.25) rotate(300deg)';
  pin.style.opacity = '.2';
  setTimeout(() => {                           // tampa fecha e a lixeira "balança"
    lix.classList.remove('hot', 'on'); lix.classList.add('bump');
    setTimeout(() => lix.classList.remove('bump'), 420);
  }, 380);
  setTimeout(() => { render(); toast('Ponto apagado. Use Desfazer para voltar.'); }, 480);
}

function ligarPin(pin, p) {
  let start = null, moved = false, antes = null, longo = false, pressTimer = null;
  pin.addEventListener('contextmenu', e => e.preventDefault());
  pin.addEventListener('click', e => e.stopPropagation());
  pin.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); editarPonto(p); } else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); apagarPonto(p); } });
  pin.addEventListener('pointerdown', e => {
    e.stopPropagation();
    start = { x: e.clientX, y: e.clientY }; moved = false; longo = false; antes = JSON.stringify(pontos);
    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => {   // segurar: abre a edição do ponto (nos dois modos)
      if (!start || moved) return;
      longo = true; clearTimeout(editTimer); ultimoToque = {};
      bloqueioModal = Date.now() + 500;
      if (navigator.vibrate) navigator.vibrate(12);
      editarPonto(p);
    }, 500);
    pin.setPointerCapture(e.pointerId);
  });
  pin.addEventListener('pointermove', e => {
    if (!start) return;
    if (!moved && Math.hypot(e.clientX - start.x, e.clientY - start.y) < 6) return;
    moved = true; clearTimeout(pressTimer);
    $('lixeira').classList.add('on');
    const r = wrap.getBoundingClientRect();
    p.x = clamp((e.clientX - r.left) / r.width);
    p.y = clamp((e.clientY - r.top) / r.height);
    pin.style.left = p.x * 100 + '%';
    pin.style.top = p.y * 100 + '%';
    $('lixeira').classList.toggle('hot', sobreLixeira(e));
  });
  pin.addEventListener('pointerup', e => {
    if (!start) return;
    pin.releasePointerCapture(e.pointerId);
    start = null; clearTimeout(pressTimer);
    if (longo) { longo = false; return; }
    if (moved) {
      if (sobreLixeira(e)) { descartar(pin, p, antes); return; }
      $('lixeira').classList.remove('on', 'hot');
      undoStack.push(antes); render(); return;
    }
    const agora = Date.now();
    clearTimeout(editTimer);
    const duplo = ultimoToque.id === p.id && agora - ultimoToque.t < 350;
    if (conf.marcacao === 'rapido') {
      ultimoToque = { id: p.id, t: agora };
      if (duplo) somarUnidade(p);
    } else if (duplo) { ultimoToque = {}; apagarPonto(p); }
    else { ultimoToque = { id: p.id, t: agora }; editTimer = setTimeout(() => editarPonto(p), 300); }
  });
  pin.addEventListener('pointercancel', () => { start = null; clearTimeout(pressTimer); $('lixeira').classList.remove('on', 'hot'); });
}

wrap.addEventListener('click', e => {
  if (Date.now() < bloqueio) return;
  const r = wrap.getBoundingClientRect();
  const x = clamp((e.clientX - r.left) / r.width), y = clamp((e.clientY - r.top) / r.height);
  if (conf.marcacao === 'rapido') {   // toque cria direto um ponto de 1 U
    snapshot();
    const novo = { id: Date.now() + Math.random(), x, y, u: 1, v: visao };
    pontos.push(novo); ultimoToque = { id: novo.id, t: Date.now() };
    render(); return;
  }
  alvo = { x, y };
  $('md-t').textContent = 'Novo ponto';
  $('md-del').style.display = 'none';
  abrir('m-dose');
});

function editarPonto(p) {
  alvo = p;
  $('md-t').textContent = `Editar ponto (${fmt(p.u)} U)`;
  $('md-del').style.display = '';
  abrir('m-dose');
}

function escolherDose(u) {
  if (!alvo) return;
  snapshot();
  if (alvo.id) alvo.u = u;
  else pontos.push({ id: Date.now() + Math.random(), x: alvo.x, y: alvo.y, u, v: visao });
  fechar(); render();
}

DOSES.forEach(u => {
  const b = document.createElement('button');
  b.textContent = fmt(u);
  b.addEventListener('click', () => escolherDose(u));
  $('doses').appendChild(b);
});

$('md-del').addEventListener('click', () => {
  if (!alvo || !alvo.id) return;
  snapshot();
  pontos = pontos.filter(p => p.id !== alvo.id);
  fechar(); render(); toast('Ponto apagado. Use Desfazer para voltar.');
});

/* ---------- ações ---------- */
$('b-undo').addEventListener('click', () => {
  if (!undoStack.length) return;
  pontos = JSON.parse(undoStack.pop()); render();
});
$('b-clear').addEventListener('click', () => {
  if (!pontos.length) return;
  if (confirm('Limpar todos os pontos deste atendimento?')) { snapshot(); pontos = []; render(); }
});
$('b-mirror').addEventListener('click', () => {
  const fr = pontos.filter(p => p.v === 'frontal');
  const novos = [];
  fr.forEach(p => {
    if (Math.abs(p.x - 0.5) < 0.03) return;
    const mx = 1 - p.x;
    if (fr.some(q => Math.hypot(q.x - mx, q.y - p.y) < 0.03)) return;
    novos.push({ id: Date.now() + Math.random(), x: mx, y: p.y, u: p.u, v: 'frontal' });
  });
  if (!novos.length) { toast('Nada para espelhar.'); return; }
  snapshot(); pontos.push(...novos); render(); toast(`${novos.length} ponto(s) espelhado(s).`);
});
$('b-save').addEventListener('click', () => {
  if (!pontos.length) { toast('Adicione ao menos um ponto antes de salvar.'); return; }
  sessoes.unshift({ id: Date.now(), dados: { ...dados }, pontos: JSON.parse(JSON.stringify(pontos)), total: pontos.reduce((s, p) => s + p.u, 0) });
  render(); toast('Mapeamento salvo no histórico.');
});

  $('f-forn').value = dados.fornecedor; $('f-obs').value = dados.obs;

/* ---------- histórico ---------- */
function listarHistorico() {
  const box = $('hist-list'); box.replaceChildren();
  if (!sessoes.length) { const p = document.createElement('p'); p.textContent = 'Nenhum mapeamento salvo ainda.'; box.appendChild(p); return; }
  sessoes.forEach(s => {
    const it = document.createElement('div'); it.className = 'item';
    const info = document.createElement('div');
    info.textContent = s.dados.nome;
    const sm = document.createElement('small');
    sm.textContent = `${dataBR(s.dados.data)} · ${fmt(s.total)} U · ${s.pontos.length} pontos`;
    info.appendChild(sm);
    const ab = document.createElement('button'); ab.textContent = 'Abrir';
    ab.addEventListener('click', () => { snapshot(); dados = { ...s.dados }; pontos = JSON.parse(JSON.stringify(s.pontos)); fechar(); render(); });
    const ex = document.createElement('button'); ex.textContent = 'Excluir'; ex.className = 'danger';
    ex.addEventListener('click', () => { if (confirm('Excluir este mapeamento?')) { sessoes = sessoes.filter(x => x.id !== s.id); persistir(); listarHistorico(); } });
    const ac = document.createElement('div'); ac.className = 'row'; ac.append(ab, ex);
    it.append(info, ac); box.appendChild(it);
  });
}
$('b-hist').addEventListener('click', () => { listarHistorico(); abrir('m-hist'); });

/* ---------- exportar / importar histórico ---------- */
async function exportarHistorico() {
  if (!sessoes.length) { toast('Não há mapeamentos para exportar.'); return; }
  const json = JSON.stringify({ app: 'facechart', versao: 2, exportadoEm: new Date().toISOString(), sessoes }, null, 2);
  const nome = `facechart-historico-${hoje()}.json`;
  const arq = new File([json], nome, { type: 'application/json' });
  try {   // no iPhone/iPad abre a folha de compartilhar (Salvar em Arquivos, AirDrop...)
    if (navigator.canShare && navigator.canShare({ files: [arq] })) { await navigator.share({ files: [arq], title: 'Histórico FaceChart' }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const url = URL.createObjectURL(arq);
  const a = document.createElement('a'); a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Arquivo exportado.');
}
const txt = (v, n) => typeof v === 'string' ? v.slice(0, n) : '';
const num = v => typeof v === 'number' && isFinite(v);
function normalizarSessao(s) {
  if (!s || typeof s !== 'object' || !s.dados || typeof s.dados !== 'object' || !Array.isArray(s.pontos)) return null;
  const pts = s.pontos
    .filter(p => p && num(p.x) && num(p.y) && num(p.u) && p.u > 0 && p.u <= 999 && (p.v === 'frontal' || p.v === 'perfil'))
    .map(p => ({ id: Date.now() + Math.random(), x: clamp(p.x), y: clamp(p.y), u: p.u, v: p.v }));
  if (!pts.length) return null;
  const d = s.dados;
  return {
    id: num(s.id) ? s.id : Date.now() + Math.random(),
    dados: { nome: txt(d.nome, 80) || 'Paciente', data: txt(d.data, 10), lote: txt(d.lote, 40), fornecedor: txt(d.fornecedor, 60), obs: txt(d.obs, 500) },
    pontos: pts, total: pts.reduce((a, p) => a + p.u, 0)
  };
}
function importarHistorico(arquivo) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      const lista = Array.isArray(j) ? j : j.sessoes;
      if (!Array.isArray(lista)) throw new Error('formato');
      let ok = 0;
      lista.forEach(x => {
        const n = normalizarSessao(x);
        if (!n || sessoes.some(e => e.id === n.id)) return;   // inválido ou já existente
        sessoes.push(n); ok++;
      });
      sessoes.sort((a, b) => b.id - a.id);
      persistir(); listarHistorico();
      const ign = lista.length - ok;
      toast(`${ok} importado(s)${ign ? `, ${ign} ignorado(s)` : ''}.`);
    } catch (e) { toast('Arquivo inválido.'); }
  };
  r.readAsText(arquivo);
}
$('h-exp').addEventListener('click', exportarHistorico);
$('h-imp').addEventListener('click', () => $('h-file').click());
$('h-file').addEventListener('change', e => { const f = e.target.files[0]; if (f) importarHistorico(f); e.target.value = ''; });

/* ---------- exportar PDF ---------- */
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const escXml = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const PROPS = ['fill', 'fill-opacity', 'stroke', 'stroke-width', 'stroke-dasharray', 'stroke-opacity', 'opacity'];

// Serializa o SVG "congelando" os estilos atuais (tema e desenho escolhidos)
function ser(el) {
  if (el.nodeType === 3) return escXml(el.textContent);
  if (el.nodeType !== 1) return '';
  const cs = getComputedStyle(el);
  if (cs.display === 'none') return '';
  const tag = el.tagName;
  if (tag === 'use') {
    const alvoUse = document.querySelector(el.getAttribute('href'));
    return `<g transform="translate(${el.getAttribute('x') || 0} ${el.getAttribute('y') || 0})">${[...alvoUse.children].map(ser).join('')}</g>`;
  }
  let at = '';
  for (const a of el.attributes) { if (a.name !== 'class' && a.name !== 'style') at += ` ${a.name}="${escXml(a.value)}"`; }
  const st = PROPS.map(k => (k === 'fill' && (el.getAttribute('fill') || '').startsWith('url(')) ? '' : `${k}:${cs.getPropertyValue(k)}`).filter(Boolean);
  if (tag === 'text') st.push(`font-size:${cs.fontSize}`, `font-family:${cs.fontFamily.replace(/"/g, "'")}`);
  return `<${tag}${at} style="${st.join(';')}">${[...el.childNodes].map(ser).join('')}</${tag}>`;
}

function carregarImagem(url) {
  return new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => erro(new Error('imagem')); i.src = url; });
}

async function rasterizar(v) {
  const W = 900, H = 1200;
  const xml = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="${W}" height="${H}"><rect width="600" height="800" fill="${css('--face')}"/><defs>${ser($('grid'))}</defs>${[...$('svg-' + v).children].map(ser).join('')}</svg>`;
  const url = URL.createObjectURL(new Blob([xml], { type: 'image/svg+xml;charset=utf-8' }));
  try {
    const img = await carregarImagem(url);
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, W, H);
    ctx.font = 'bold 30px "Trebuchet MS","Segoe UI",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    pontos.filter(p => p.v === v).forEach(p => {
      const t = fmt(p.u) + 'U', w = ctx.measureText(t).width + 28, h = 44, r = h / 2, x = p.x * W, y = p.y * H;
      ctx.beginPath(); ctx.arc(x - w / 2 + r, y, r, Math.PI / 2, Math.PI * 1.5); ctx.arc(x + w / 2 - r, y, r, Math.PI * 1.5, Math.PI / 2); ctx.closePath();
      ctx.fillStyle = css('--cy'); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = css('--wh'); ctx.stroke();
      ctx.fillStyle = css('--onacc'); ctx.fillText(t, x, y + 2);
    });
    const bin = atob(c.toDataURL('image/jpeg', 0.92).split(',')[1]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return { bytes, w: W, h: H };
  } finally { URL.revokeObjectURL(url); }
}

// Gerador mínimo de PDF (A4, 1 página, fontes Helvetica, 2 imagens JPEG)
const enc = t => Uint8Array.from(t, ch => ch.charCodeAt(0) & 255);
const l1 = t => String(t).replace(/[^\x20-\x7E\xA0-\xFF]/g, '?').replace(/[\\()]/g, '\\$&');
function montarPDF(conteudo, imgs) {
  const partes = [], off = []; let tam = 0;
  const add = b => { const u = typeof b === 'string' ? enc(b) : b; partes.push(u); tam += u.length; };
  const obj = (n, corpo, stream) => {
    off[n] = tam;
    if (stream) { add(`${n} 0 obj\n<< ${corpo} /Length ${stream.length} >>\nstream\n`); add(stream); add('\nendstream\nendobj\n'); }
    else add(`${n} 0 obj\n${corpo}\nendobj\n`);
  };
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> /XObject << /I1 7 0 R /I2 8 0 R >> >> /Contents 4 0 R >>');
  obj(4, '', enc(conteudo));
  obj(5, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  obj(6, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  imgs.forEach((im, i) => obj(7 + i, `/Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode`, im.bytes));
  const xref = tam;
  add('xref\n0 9\n0000000000 65535 f \n' + off.slice(1).map(o => String(o).padStart(10, '0') + ' 00000 n \n').join(''));
  add(`trailer\n<< /Size 9 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(partes, { type: 'application/pdf' });
}

function quebrar(t, n) {
  const out = [];
  t.split(/\n/).forEach(par => {
    let l = '';
    par.split(/\s+/).forEach(w => { if ((l + ' ' + w).trim().length > n) { if (l) out.push(l); l = w; } else l = (l + ' ' + w).trim(); });
    out.push(l);
  });
  return out;
}

async function entregarArquivo(arq, titulo) {
  try {
    if (navigator.canShare && navigator.canShare({ files: [arq] })) { await navigator.share({ files: [arq], title: titulo }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const url = URL.createObjectURL(arq);
  const a = document.createElement('a'); a.href = url; a.download = arq.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function exportarPDF() {
  if (!pontos.length) { toast('Adicione ao menos um ponto antes de exportar.'); return; }
  const btn = $('b-pdf');
  btn.disabled = true; toast('Gerando PDF…');
  try {
    const imgs = [await rasterizar('frontal'), await rasterizar('perfil')];
    const C = [];
    const T = (x, y, f, sz, t, g = 0) => C.push(`BT /${f} ${sz} Tf ${g} g ${x} ${y} Td (${l1(t)}) Tj ET`);
    const soma = a => a.reduce((s, p) => s + p.u, 0);
    const fr = pontos.filter(p => p.v === 'frontal'), pf = pontos.filter(p => p.v === 'perfil');

    T(40, 800, 'F2', 18, 'FaceChart - Mapa de aplicação');
    [['Paciente:', dados.nome], ['Data:', dataBR(dados.data)], ['Lote:', dados.lote || '-'], ['Fornecedor:', dados.fornecedor || '-']].forEach(([k, v], i) => {
      T(40, 772 - i * 14, 'F2', 11, k); T(110, 772 - i * 14, 'F1', 11, v);
    });
    let y = 716;
    if (dados.obs) {
      T(40, y, 'F2', 11, 'Observações:'); y -= 14;
      quebrar(dados.obs, 95).slice(0, 5).forEach(l => { T(40, y, 'F1', 10, l); y -= 13; });
      y -= 4;
    }
    const IW = 250, IH = IW * 4 / 3, yb = y - 8 - IH;
    T(40, y, 'F2', 11, `Frontal (${fr.length} ponto${fr.length === 1 ? '' : 's'}, ${fmt(soma(fr))} U)`);
    T(305, y, 'F2', 11, `Perfil (${pf.length} ponto${pf.length === 1 ? '' : 's'}, ${fmt(soma(pf))} U)`);
    C.push(`q ${IW} 0 0 ${IH} 40 ${yb} cm /I1 Do Q`, `q ${IW} 0 0 ${IH} 305 ${yb} cm /I2 Do Q`);

    let yy = yb - 28;
    T(40, yy, 'F2', 16, `Total: ${fmt(soma(pontos))} U`);
    T(200, yy, 'F1', 11, `${pontos.length} ponto${pontos.length === 1 ? '' : 's'} marcados`);
    const lado = f => fmt(soma(fr.filter(f)));
    yy -= 18; T(40, yy, 'F1', 11, `Visão frontal - lado direito do paciente: ${lado(p => p.x < 0.48)} U | centro: ${lado(p => p.x >= 0.48 && p.x <= 0.52)} U | lado esquerdo: ${lado(p => p.x > 0.52)} U`);
    const cont = {}; pontos.forEach(p => { cont[p.u] = (cont[p.u] || 0) + 1; });
    yy -= 16; T(40, yy, 'F1', 11, 'Doses: ' + Object.keys(cont).map(Number).sort((a, b) => b - a).map(u => `${fmt(u)} U x ${cont[u]}`).join('  |  '));
    T(40, 30, 'F1', 8, `Gerado em ${new Date().toLocaleString('pt-BR')} - FaceChart`, 0.5);

    const slug = (dados.nome || 'paciente').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/gi, '-').toLowerCase().slice(0, 30) || 'paciente';
    const arq = new File([montarPDF(C.join('\n'), imgs)], `facechart-${slug}-${dados.data || hoje()}.pdf`, { type: 'application/pdf' });
    await entregarArquivo(arq, 'Mapa FaceChart');
    toast('PDF pronto.');
  } catch (e) { toast('Não foi possível gerar o PDF.'); }
  finally { btn.disabled = false; }
}
$('b-pdf').addEventListener('click', exportarPDF);

/* ---------- configurações ---------- */
function aplicarConf() {
  const t = TEMAS.find(x => x[0] === conf.tema) || TEMAS[0];
  const st = document.documentElement.style;
  CHAVES.forEach((k, i) => st.setProperty('--' + k, t[3 + i]));
  st.colorScheme = t[2];
  const mt = document.querySelector('meta[name=theme-color]'); if (mt) mt.content = t[3];
  wrap.dataset.d = DESENHOS.some(d => d[0] === conf.desenho) ? conf.desenho : 'blueprint';
}
function opcao(nome, desc, ativo, onClick, swatch) {
  const b = document.createElement('button');
  b.className = 'opt'; b.setAttribute('aria-pressed', ativo);
  if (swatch) { const sw = document.createElement('span'); sw.className = 'sw'; swatch.forEach(c => { const i = document.createElement('i'); i.style.background = c; sw.appendChild(i); }); b.appendChild(sw); }
  const n = document.createElement('span'); n.textContent = nome; b.appendChild(n);
  if (desc) { const sm = document.createElement('small'); sm.textContent = desc; b.appendChild(sm); }
  b.addEventListener('click', onClick);
  return b;
}
function ajuda() {
  const modo = conf.marcacao === 'rapido'
    ? 'Toque no rosto para criar um ponto de 1 U. Toque duas vezes no mesmo ponto para somar +1 U.'
    : 'Toque no rosto para marcar e escolher as unidades. Toque num ponto para editar ou dê dois toques para apagar.';
  return `${modo} Segure um ponto para abrir a edição (alterar a dose ou apagar) e arraste para mover (solte o ponto na lixeira, no canto do desenho, para apagar). Na barra acima do desenho: alternar frontal/perfil, desfazer, espelhar (copia os pontos para o lado oposto), limpar, exportar PDF e salvar mapeamento.`;
}
function montarConf() {
  const gt = $('c-temas'), gd = $('c-desenhos');
  gt.replaceChildren(); gd.replaceChildren();
  TEMAS.forEach(t => gt.appendChild(opcao(t[1], '', conf.tema === t[0], () => { conf.tema = t[0]; aplicarConf(); persistir(); montarConf(); }, [t[4], t[7], t[8]])));
  const gm = $('c-marcacao'); gm.replaceChildren();
  MARCACOES.forEach(m => gm.appendChild(opcao(m[1], m[2], conf.marcacao === m[0], () => { conf.marcacao = m[0]; persistir(); montarConf(); })));
  $('c-ajuda').textContent = ajuda();
  DESENHOS.forEach(d => gd.appendChild(opcao(d[1], d[2], conf.desenho === d[0], () => { conf.desenho = d[0]; aplicarConf(); persistir(); montarConf(); })));
}
$('b-conf').addEventListener('click', () => { montarConf(); abrir('m-conf'); });

/* ---------- fechar modais ---------- */
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', fechar));
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m && Date.now() > bloqueioModal) fechar(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') fechar(); });

$('v-frontal').addEventListener('click', () => mudarVisao('frontal'));
$('v-perfil').addEventListener('click', () => mudarVisao('perfil'));

carregar();
aplicarConf();
mudarVisao('frontal');
</script>
